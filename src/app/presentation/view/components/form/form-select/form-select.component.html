<select
    [ngClass]="class"
    [formControlName]="formControlName"
    [value]="value"
    (change)="onSelectChange($event)"
    [ngClass]="getClassList()"
>
    @for (option of options; track option) {
        <option [value]="option.value">
            {{ option.label }}
        </option>
    }
</select>
